<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarboLoom - Your Carbon Footprint Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              'primary-light': 'var(--color-primary-light)',
              'primary-dark': 'var(--color-primary-dark)',
              background: 'var(--color-bg)',
              card: 'var(--color-card)',
              text: 'var(--color-text)',
              'text-secondary': 'var(--color-text-secondary)',
              border: 'var(--color-border)',
            },
          },
        },
      }
    </script>
    <style>
      :root {
        /* Default Light Theme with new semantic variables */
        --color-primary: #4CAF50;
        --color-primary-light: #81C784;
        --color-primary-dark: #388E3C;
        --color-bg: #F1F8E9;
        --color-card: #FFFFFF;
        --color-text: #212121;
        --color-text-secondary: #666666;
        --color-border: #E0E0E0;
        --pattern-background: none;
        --color-pattern: rgba(0, 0, 0, 0.08);
      }
      .dark {
        /* Default Dark Theme with new semantic variables */
        --color-primary: #81C784;
        --color-primary-light: #A5D6A7;
        --color-primary-dark: #4CAF50;
        --color-bg: #121212;
        --color-card: #1E1E1E;
        --color-text: #E0E0E0;
        --color-text-secondary: #A0A0A0;
        --color-border: #424242;
        --color-pattern: rgba(255, 255, 255, 0.08);
      }
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: var(--pattern-background);
        background-size: 80px; /* Denser pattern */
        color: var(--color-pattern); /* Use variable to color the SVG */
        /* Removed transition on background-image/color as it's unreliable with data URLs */
      }
      
      /* Success Animation Styles */
      .success-animation-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        animation: fade-in-out 1.5s ease-in-out forwards;
      }

      .success-animation-container {
        width: 100px;
        height: 100px;
        display: block;
      }

      .success-animation-svg {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: block;
        stroke-width: 3;
        stroke: #fff;
        stroke-miterlimit: 10;
        box-shadow: inset 0px 0px 0px var(--color-primary);
        animation: fill-color 0.4s ease-in-out 0.4s forwards, scale-up 0.3s ease-in-out 0.9s both;
      }

      .success-animation-circle {
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        stroke-width: 3;
        stroke-miterlimit: 10;
        stroke: var(--color-primary);
        fill: none;
        animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      }

      .success-animation-checkmark {
        transform-origin: 50% 50%;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
      }

      @keyframes stroke {
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes scale-up {
        0% {
          transform: none;
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: none;
        }
      }

      @keyframes fill-color {
        100% {
          box-shadow: inset 0px 0px 0px 50px var(--color-primary);
        }
      }

      @keyframes fade-in-out {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.16.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
